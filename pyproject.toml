[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "verislop"
version = "0.1.0"
description = "VeriSlop CLI — Verify the Slop: contract-first verification of generated software"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
verislop = "verislop.cli:main"
verislop-ui = "verislop.web:main"

[tool.setuptools]
packages = ["verislop", "verislop.providers", "verislop.targets", "verislop.bridges", "verislop.backends"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.setuptools.package-data]
verislop = ["lean/*.lean", "lean/VSCore/*.lean", "lean/VSCore2/*.lean", "lean/VSCore3/*.lean", "web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]
