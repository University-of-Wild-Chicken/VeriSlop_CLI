name: Offline Python regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-regressions:
    name: Python ${{ matrix.python-version }} offline regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Standard library only; run from the checkout without pip or model setup.
      # Workbench tests use loopback HTTP and controlled Python children only.
      # No Lean, sandbox, live inference or archived campaigns.
      - name: Run selected deterministic regressions
        env:
          PYTHONPATH: tests
        run: >-
          python -m unittest -v
          test_broker_budget
          test_agent_effects
          test_budget_patch_audit
          test_workbench

  workbench-distribution:
    name: Workbench assets and installable distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: node --check verislop/web_assets/app.js
      # These are build tools only; the installed application remains stdlib-only.
      - name: Install Python build tools
        run: python -m pip install 'setuptools>=64' wheel
      - name: Build and inspect the installed distribution outside the checkout
        env:
          PYTHONPATH: tests
          VERISLOP_TEST_DISTRIBUTION: '1'
        run: python -m unittest -v test_distribution
